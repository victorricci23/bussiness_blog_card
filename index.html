<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="This is a example of a bussiness card" />
    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sora:wght@100..800&display=swap" rel="stylesheet">

    <title>Business Blog Card | devChallenges.io</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background-color: green;
        display: flex;
        flex-direction: column;
        font-family: Lato;
        align-items: center;
        background-color: #F2F5F9;
      }

      .card {
        margin-top: 200px;
        margin-bottom: 200px;
        width: 418px;
        max-width: 100%;
        background-color: #FFFFFF;
        border-radius: 12px;
        box-shadow: 0px 30px 100px 0px rgba(17, 23, 41, 0.05);
      }

      .card p {
        color: #4A5567;
      }

      .card h1,
      .card h1 {
        color: #111729;
      }

      .card-top {
        position: relative;
      }

      .card-top-img-1 {
        border-radius: 12px;

      }
      .card-top-img-2 {
        position: absolute;
        bottom: 0px;
        left: 0;
      }

      .card-middle {
        padding: 30px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        row-gap: 10px;
      }

      .card-middle h1 {
        font-family: Poppins;
        font-weight: 500;
        line-height: 1.3;
        font-size: 23px;
        padding-right: 50px;
      }

      .card-middle p {
        font-size: 16px;
        padding-right: 50px;
      }

      .separador {
        width: 100%;
        height: 2px;
        background: #E5EAF0;
      }

      .card-bottom {
        padding: 30px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        column-gap: 15px;
      }

      .card-bottom img {
        border-radius: 50%;
        border: 4px solid #F2F5F9;
        width: 50px;
        height: 50px;
      }

      .card-bottom h2 {
        font-size: 16px;
      }

      .card-bottom p {
        font-size: 14px;
      }

      .author-info {
        font-size: 14px;
        text-align: center;
        margin-top: auto;
        color: rgb(55, 65, 81);
      }

      .author-info a {
        color: rgb(55, 65, 81);
        text-decoration: underline;
      }

      @media (min-width: 1024px) {
        .card {
          margin-top: 100px;
          margin-bottom: 100px;
        }

      }

    </style>
  </head>
  <body>
    <div class="card" >
      <div class="card-top" >
        <img class="card-top-img-1" src="/home/victorricci/Documentos/programação/frontend/CHALLENGES/Business-blog-card-starter-master/resources/hero-image-1.jpg" alt="meeting" />
        <img class="card-top-img-2" src="/home/victorricci/Documentos/programação/frontend/CHALLENGES/Business-blog-card-starter-master/resources/white-overlay.svg" alt="wave" />
      </div>
        <div class="card-middle">
          <h1>Perfect solution for small business</h1>
          <p>Small businesses need to generate leads to grow. You can use tools like Ringy.</p>
        </div>

        <p class="separador"></p>

        <div class="card-bottom">
          <img src="/home/victorricci/Documentos/programação/frontend/CHALLENGES/Business-blog-card-starter-master/resources/avatar-image-business-card-1.png" alt="Avatar" />
          <div>
            <h2>Amy Burgess</h2>
            <p>Customer Manger, Solution Oy</p>
          </div>
        </div>
    </div>

    <div class="author-info">
      Coded by <a href="#">Victor C. Ricci</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>
  </body>
</html>
